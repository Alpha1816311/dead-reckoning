plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.idr.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "com.idr.mobile"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "2.0-mvp"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Proguard disabled for MVP — keeping full symbols for debugging
        }
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    // FileProvider (part of androidx.core — already included above)
}
